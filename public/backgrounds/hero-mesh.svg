<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" fill="none">
  <rect width="1440" height="900" fill="#09090b"/>
  <defs>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="grad-indigo" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.08"/>
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="glow-top" cx="20%" cy="15%" r="40%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-bottom" cx="80%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <!-- Ambient Glow Fields -->
  <rect width="1440" height="900" fill="url(#glow-top)"/>
  <rect width="1440" height="900" fill="url(#glow-bottom)"/>

  <!-- Organic Wave Layer 1 (Deep background) -->
  <path d="M0,320 C320,440 420,180 720,260 C1020,340 1120,480 1440,380 L1440,900 L0,900 Z" fill="url(#grad-indigo)" opacity="0.6"/>

  <!-- Organic Wave Layer 2 (Mid layer) -->
  <path d="M0,480 C260,380 520,540 800,420 C1080,300 1260,510 1440,460 L1440,900 L0,900 Z" fill="url(#grad-emerald)" opacity="0.5"/>

  <!-- Organic Wave Layer 3 (Foreground swell) -->
  <path d="M0,640 C340,580 620,720 940,610 C1220,510 1340,680 1440,650 L1440,900 L0,900 Z" fill="url(#grad-indigo)" opacity="0.4"/>

  <!-- Diffused Soft Light Orbs -->
  <circle cx="280" cy="220" r="160" fill="#10b981" opacity="0.03" filter="url(#blur-filter)"/>
  <circle cx="1160" cy="680" r="220" fill="#6366f1" opacity="0.035" filter="url(#blur-filter)"/>
  <circle cx="720" cy="450" r="180" fill="#10b981" opacity="0.02" filter="url(#blur-filter)"/>
</svg>
